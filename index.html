<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>Дія</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дія">

<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%230a0a0a'/%3E%3Ctext x='96' y='128' font-family='sans-serif' font-size='76' font-weight='700' fill='%23fff' text-anchor='middle'%3EДія%3C/text%3E%3C/svg%3E">

<style>
@font-face{
  font-family:'e-Ukraine';
  src:url('https://raw.githubusercontent.com/bennetfabian/e-Ukraine/master/e-Ukraine-Regular.otf') format('opentype');
  font-weight:400;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'e-Ukraine';
  src:url('https://raw.githubusercontent.com/bennetfabian/e-Ukraine/master/e-Ukraine-Medium.otf') format('opentype');
  font-weight:500;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'e-Ukraine';
  src:url('https://raw.githubusercontent.com/bennetfabian/e-Ukraine/master/e-Ukraine-Bold.otf') format('opentype');
  font-weight:700;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'e-UkraineHead';
  src:url('https://raw.githubusercontent.com/bennetfabian/e-Ukraine/master/e-UkraineHead-Regular.otf') format('opentype');
  font-weight:400;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'e-UkraineHead';
  src:url('https://raw.githubusercontent.com/bennetfabian/e-Ukraine/master/e-UkraineHead-Medium.otf') format('opentype');
  font-weight:500;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'e-UkraineHead';
  src:url('https://raw.githubusercontent.com/bennetfabian/e-Ukraine/master/e-UkraineHead-Bold.otf') format('opentype');
  font-weight:700;font-style:normal;font-display:swap;
}

:root{
  --black:#0a0a0a;--white:#fff;--blue:#005BBB;--yellow:#FFD500;
  --text:#0a0a0a;--muted:#7A7F87;--line:#EEF0F3;--danger:#E53935;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --tabh:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:'e-Ukraine',-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  font-weight:400;
  background:#000;color:var(--text);
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  font-feature-settings:"kern" 1,"liga" 1;
}
#app{height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column}

.bg{position:absolute;inset:0;z-index:0}
.bg.feed{background:linear-gradient(170deg,#cddff0 0%,#d0e4dd 50%,#d9e8dd 100%)}
.bg.docs{background:linear-gradient(170deg,#c8dce6 0%,#cdd8e0 40%,#d6d0dc 75%,#dccddf 100%)}
.bg.ai{background:linear-gradient(170deg,#ded0e4 0%,#ead3d3 55%,#f0ddce 100%)}
.bg.srv{background:linear-gradient(170deg,#cddff0 0%,#d0e4dd 50%,#d9e8dd 100%)}
.bg.menu{background:linear-gradient(170deg,#cddff0 0%,#d0e4dd 50%,#d9e8dd 100%)}

/* splash */
.splash{
  position:absolute;inset:0;z-index:500;
  background:linear-gradient(180deg,#c7d8ec 0%,#cddfe2 35%,#d3e2d3 62%,#dfe9c9 88%,#e8ecc4 100%);
  display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 22px);
  animation:splashOut 500ms 1600ms cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.splash-trident-top{width:34px;height:52px;flex-shrink:0;opacity:0;animation:tIn 900ms 200ms cubic-bezier(.22,.61,.36,1) forwards}
@keyframes tIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.splash-hi{
  font-family:'e-UkraineHead','e-Ukraine',sans-serif;
  font-weight:700;font-size:60px;letter-spacing:-1.2px;line-height:1;color:#0a0a0a;
  flex:1;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(14px);
  animation:hiIn 700ms 500ms cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes hiIn{to{opacity:1;transform:none}}
.splash-hi .wave{display:inline-block;margin-left:10px;animation:wave 1.6s 900ms ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{
  0%,100%{transform:rotate(0)}
  15%{transform:rotate(18deg)}
  30%{transform:rotate(-10deg)}
  45%{transform:rotate(16deg)}
  60%{transform:rotate(-4deg)}
  75%{transform:rotate(8deg)}
}
.splash-badges{display:flex;gap:12px;flex-shrink:0;margin-bottom:6px;opacity:0;transform:translateY(20px);animation:bIn 700ms 850ms cubic-bezier(.22,.61,.36,1) forwards}
@keyframes bIn{to{opacity:1;transform:none}}
.splash-badge{width:66px;height:66px;border-radius:19px;display:grid;place-items:center}
.splash-badge.diia{
  background:#0a0a0a;color:#fff;
  font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.3px;
}
.splash-badge.tryzub{background:transparent;border:1.6px solid #0a0a0a}

/* layout */
.view{position:relative;z-index:1;flex:1;overflow:hidden;display:flex;flex-direction:column}
.page{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--st) + 14px) 16px calc(var(--tabh) + var(--sb) + 26px);
  animation:pgIn 240ms cubic-bezier(.22,.61,.36,1);
}
.page.noScroll{overflow:hidden;padding-left:0;padding-right:0;padding-bottom:calc(var(--tabh) + var(--sb));padding-top:0}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* typography */
.hello{font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:700;font-size:32px;letter-spacing:-.6px;margin:8px 0 24px;line-height:1.1}
.hello .wave{display:inline-block;margin-left:6px;animation:wave 2.4s ease-in-out infinite;transform-origin:70% 70%;font-size:32px}
h1.title{font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:700;font-size:32px;letter-spacing:-.6px;margin:8px 0 18px;line-height:1.1}

/* feed */
.nlCard{background:#d5e5f5;border-radius:22px;padding:22px 22px 20px;margin-bottom:28px;cursor:pointer;transition:transform 200ms cubic-bezier(.22,.61,.36,1)}
.nlCard:active{transform:scale(.985)}
.nlTitle{font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.5px;margin-bottom:12px;color:#0a0a0a;line-height:1.1}
.nlText{font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:15px;line-height:1.42;color:#111;margin-bottom:20px}
.nlRow{display:flex;align-items:center;gap:10px}
.nlDot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:#fff}
.nlDot.y{background:#FFD500;color:#0a0a0a}
.nlDot.b{background:#0A84FF}
.nlDot.g{background:#2E7D32}
.nlDot svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nlGo{margin-left:auto;width:38px;height:38px;border-radius:50%;background:#0a0a0a;color:#fff;display:grid;place-items:center;transition:transform 220ms cubic-bezier(.22,.61,.36,1)}
.nlCard:active .nlGo{transform:translateX(4px)}
.nlGo svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.quickRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:28px}
.quick{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:transform 140ms cubic-bezier(.22,.61,.36,1)}
.quick:active{transform:scale(.93)}
.quickIc{width:66px;height:66px;border-radius:19px;background:#0a0a0a;color:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.14)}
.quickIc svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.quickL{font-family:'e-Ukraine',sans-serif;font-weight:500;font-size:12.5px;line-height:1.22;text-align:center;color:#0a0a0a}

.drone{
  border-radius:22px;overflow:hidden;margin-bottom:28px;height:210px;position:relative;cursor:pointer;
  background:
    radial-gradient(circle at 18% 22%,rgba(120,160,120,.20),transparent 42%),
    radial-gradient(circle at 78% 68%,rgba(90,130,90,.16),transparent 46%),
    radial-gradient(circle at 50% 110%,rgba(60,90,60,.30),transparent 55%),
    linear-gradient(150deg,#0d1510 0%,#1a2418 55%,#0f1a13 100%);
  transition:transform 200ms cubic-bezier(.22,.61,.36,1);
}
.drone:active{transform:scale(.985)}
.drone::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:
    repeating-linear-gradient(115deg,rgba(255,255,255,.028) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.018) 0 1px,transparent 1px 34px);
}
.droneInner{position:absolute;top:0;left:0;right:0;bottom:56px;display:flex;align-items:center;padding:24px;gap:18px}
.droneLogo{width:78px;height:78px;border-radius:18px;background:rgba(255,255,255,.08);border:1.8px solid rgba(255,255,255,.9);display:grid;place-items:center;flex-shrink:0}
.droneLogo svg{width:44px;height:44px;fill:#fff}
.droneTxt{font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:700;color:#fff;font-size:30px;line-height:.96;letter-spacing:-.4px}
.droneFoot{
  position:absolute;left:0;right:0;bottom:0;height:56px;
  display:flex;align-items:center;padding:0 22px;color:#fff;
  font-family:'e-Ukraine',sans-serif;font-weight:500;font-size:16px;
  background:linear-gradient(to top,rgba(0,0,0,.5),transparent);
}
.droneFoot .nlGo{margin-left:auto;width:38px;height:38px;background:#fff;color:#0a0a0a}
.droneFoot .nlGo svg{stroke:#0a0a0a}

.sectionTitle{font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.5px;margin:6px 0 16px;color:#0a0a0a}

/* docs carousel */
.docsTrack{
  flex:1;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  display:flex;gap:14px;padding:calc(var(--st) + 8px) 32px 0;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;perspective:1600px;
}
.docsTrack::-webkit-scrollbar{display:none}
.docSlide{
  flex:0 0 calc(100vw - 64px);max-width:430px;
  scroll-snap-align:center;
  height:calc(100% - var(--tabh) - var(--sb) - 62px);
  perspective:1600px;position:relative;
}
.flipInner{position:relative;width:100%;height:100%;transition:transform 640ms cubic-bezier(.22,.61,.36,1);transform-style:preserve-3d}
.flipInner.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:26px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  overflow:hidden;box-shadow:0 4px 18px rgba(20,40,70,.10);
}
.face.back{
  transform:rotateY(180deg);background:#fff;
  display:flex;flex-direction:column;align-items:center;
  padding:28px 24px 24px;
}
.qrTimer{font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:14px;color:#9aa1ab;margin-bottom:22px;text-align:center}
.qrCanvas{width:min(72vw,250px);height:min(72vw,250px);background:#fff;margin-bottom:26px;flex-shrink:0}
.qrBtns{display:flex;gap:36px;justify-content:center;align-items:flex-start;margin-top:auto;padding-bottom:6px}
.qrBtn{display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;transition:transform 140ms}
.qrBtn:active{transform:scale(.94)}
.qrBtn .ico{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;transition:background 200ms,color 200ms}
.qrBtn.active .ico{background:#0a0a0a;color:#fff}
.qrBtn:not(.active) .ico{background:#eeeff1;color:#0a0a0a}
.qrBtn .lbl{font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:16px;color:#0a0a0a}
.qrBtn .ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.docCard{width:100%;height:100%;display:flex;flex-direction:column;background:linear-gradient(155deg,#c7dff0 0%,#cbe1e0 45%,#cbe2d5 100%);cursor:pointer}
.docCard.purple{background:linear-gradient(155deg,#c7dff0 0%,#d0cde5 50%,#ddcadd 100%)}
.docCard.blue{background:linear-gradient(155deg,#c6dcf0 0%,#c9dfe6 100%)}
.docCard.pink{background:linear-gradient(155deg,#e8d4e0 0%,#ecd9d4 50%,#f0e0d0 100%)}
.docCard.green{background:linear-gradient(155deg,#c7dff0 0%,#cbe1e0 45%,#cbe2d5 100%)}

.docHead{padding:26px 26px 6px}
.docHeadTitle{font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:500;font-size:19px;line-height:1.22;letter-spacing:-.2px;color:#0a0a0a;max-width:82%}
.docHeadSub{font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:15px;color:#2b2b2b;margin-top:8px}
.docBody{flex:1;padding:14px 26px 8px;overflow:hidden;display:flex;gap:18px;min-height:0}
.docPhoto{
  width:132px;height:174px;border-radius:5px;background:#f0f0f0;flex-shrink:0;
  background-size:cover;background-position:center;overflow:hidden;
  border:1px solid rgba(0,0,0,.06);
  display:grid;place-items:center;color:#b9bec7;
  font-family:'e-Ukraine',sans-serif;font-weight:500;font-size:26px;
}
.docInfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px;padding-top:2px}
.docFld .lbl{font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:13px;color:#3a3a3a;margin-bottom:4px;line-height:1.2}
.docFld .val{font-family:'e-Ukraine',sans-serif;font-weight:500;font-size:17px;color:#0a0a0a;line-height:1.25;word-break:break-word}
.docSign{
  margin-top:auto;width:138px;height:48px;flex-shrink:0;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 80'%3E%3Cg fill='none' stroke='%230a0a0a' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M18 58 C22 30,34 18,44 32 C52 44,48 58,60 50 C74 40,68 22,82 26 C96 30,84 54,100 48 C116 42,108 24,122 28 C136 32,124 54,140 46 C152 40,148 26,164 32 C178 38,172 52,192 34 C198 28,204 30,210 36'/%3E%3Cpath d='M44 62 C60 56,90 60,116 54' opacity='.6'/%3E%3C/g%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:left center;background-size:contain;
}
.docBigNum{
  font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:500;
  font-size:42px;color:#0a0a0a;letter-spacing:.5px;
  margin-top:auto;margin-bottom:14px;display:flex;align-items:center;gap:12px;
  font-variant-numeric:tabular-nums;line-height:1;
}
.copyBtn{width:38px;height:38px;border-radius:9px;background:rgba(0,0,0,.055);display:grid;place-items:center;flex-shrink:0;border:none;cursor:pointer;transition:background 140ms,transform 140ms}
.copyBtn:active{background:rgba(0,0,0,.13);transform:scale(.92)}
.copyBtn svg{width:19px;height:19px;stroke:#0a0a0a;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.docUpdated{
  background:rgba(190,225,165,.72);padding:9px 26px;
  font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:12.5px;color:#0a0a0a;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.docName{
  padding:20px 76px 24px 26px;
  font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:700;
  font-size:21px;line-height:1.12;letter-spacing:-.2px;
  color:#0a0a0a;text-transform:uppercase;
  position:relative;flex-shrink:0;
}
.docMore{position:absolute;right:24px;bottom:24px;width:44px;height:44px;border-radius:50%;background:#0a0a0a;color:#fff;border:none;cursor:pointer;display:grid;place-items:center;transition:transform 140ms}
.docMore:active{transform:scale(.9)}
.docMore span{display:block;width:4px;height:4px;background:#fff;border-radius:50%;box-shadow:8px 0 0 #fff,-8px 0 0 #fff}

.dots{display:flex;justify-content:center;gap:9px;padding:16px 0 14px;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.7);transition:background 220ms,transform 220ms cubic-bezier(.22,.61,.36,1)}
.dot.on{background:#fff;transform:scale(1.1)}

.actionCard{
  flex:0 0 calc(100vw - 64px);max-width:430px;
  scroll-snap-align:center;border-radius:26px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;color:#0a0a0a;text-align:center;padding:40px;
  height:calc(100% - var(--tabh) - var(--sb) - 62px);
  margin-top:calc(var(--st) + 8px);
  cursor:pointer;transition:transform 200ms cubic-bezier(.22,.61,.36,1);
  background:linear-gradient(155deg,#f0dde3 0%,#eadce1 100%);
  font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:500;font-size:20px;letter-spacing:-.2px;line-height:1.2;
}
.actionCard.reorder{background:linear-gradient(155deg,#e0d3e6 0%,#e8dcd6 100%);line-height:1.22}
.actionCard:active{transform:scale(.98)}
.actionCard .acIc{width:62px;height:62px;border-radius:50%;border:2px solid #0a0a0a;display:grid;place-items:center;flex-shrink:0}
.actionCard .acIc svg{width:28px;height:28px;stroke:#0a0a0a;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* services */
.srvSearch{background:#fff;border-radius:16px;padding:13px 18px;display:flex;align-items:center;gap:12px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.srvSearch svg{width:20px;height:20px;stroke:#9aa1ab;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.srvSearch input{flex:1;border:none;outline:none;background:transparent;font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:16px;color:#0a0a0a;padding:0;-webkit-user-select:text;user-select:text}
.srvSearch input::placeholder{color:#9aa1ab}
.srvGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.srvCard{background:rgba(255,255,255,.55);border-radius:18px;padding:16px;min-height:140px;display:flex;flex-direction:column;gap:16px;cursor:pointer;transition:transform 180ms cubic-bezier(.22,.61,.36,1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.4)}
.srvCard:active{transform:scale(.97)}
.srvIc{width:46px;height:46px;border-radius:50%;background:#0a0a0a;color:#fff;display:grid;place-items:center;flex-shrink:0}
.srvIc svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.srvL{font-family:'e-Ukraine',sans-serif;font-weight:500;font-size:15px;color:#0a0a0a;line-height:1.22;margin-top:auto}

/* menu */
.menuHead{padding:8px 0 22px}
.menuHead h1{font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:700;font-size:32px;letter-spacing:-.6px;margin:0 0 8px}
.menuHead .ver{font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:13.5px;color:var(--muted)}
.menuGroup{background:#fff;border-radius:18px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.menuItem{
  display:flex;align-items:center;gap:16px;padding:17px 20px;
  font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:16px;color:#0a0a0a;
  cursor:pointer;border-bottom:1px solid var(--line);transition:background 140ms;
}
.menuItem:last-child{border-bottom:none}
.menuItem:active{background:#f6f7f9}
.menuItem svg{width:24px;height:24px;stroke:#0a0a0a;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.menuAv{width:36px;height:36px;border-radius:50%;background:#005BBB center/cover;color:#fff;display:grid;place-items:center;font-family:'e-Ukraine',sans-serif;font-weight:700;font-size:13px;flex-shrink:0}

/* tabbar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;background:#0a0a0a;display:flex;justify-content:space-around;align-items:flex-start;padding:6px 0 calc(6px + var(--sb));height:calc(var(--tabh) + var(--sb))}
.tb{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#8a8a8a;font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:11px;
  cursor:pointer;padding:4px 0;transition:color 220ms cubic-bezier(.22,.61,.36,1);
}
.tb svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;transition:transform 260ms cubic-bezier(.22,.61,.36,1)}
.tb.on{color:#fff}
.tb.on svg{transform:translateY(-2px)}
.tb:active svg{transform:scale(.9)}

/* modal */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.36);animation:fadeIn 220ms ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:#f5f6f8;border-radius:22px 22px 0 0;max-height:90%;padding:10px 20px calc(24px + var(--sb));overflow-y:auto;-webkit-overflow-scrolling:touch;animation:sheetUp 320ms cubic-bezier(.22,.61,.36,1);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheetGrab{width:38px;height:4px;border-radius:2px;background:#d5d8dd;margin:6px auto 16px}
.sheet h2{font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:700;font-size:21px;letter-spacing:-.4px;margin:0 0 16px}

.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:13px;color:var(--muted);padding-left:2px}
.fld input,.fld textarea,.fld select{
  width:100%;padding:14px 16px;border:1px solid #e0e4ea;border-radius:12px;
  font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:16px;
  background:#fff;outline:none;color:#0a0a0a;
  -webkit-user-select:text;user-select:text;
  transition:border-color 160ms;-webkit-appearance:none;
}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--blue)}
.fld textarea{min-height:80px;resize:vertical;font-family:ui-monospace,monospace;font-size:13px}
.fld select{background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%237A7F87' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 16px center;background-size:12px;padding-right:44px}

.btn{
  display:block;width:100%;padding:15px 16px;border-radius:14px;border:none;
  font-family:'e-Ukraine',sans-serif;font-weight:500;font-size:16px;cursor:pointer;
  transition:transform 130ms,background 160ms,opacity 160ms;text-align:center;
}
.btn:active{transform:scale(.985)}
.btn.pri{background:#0a0a0a;color:#fff}
.btn.sec{background:#fff;color:#0a0a0a;border:1px solid #e0e4ea}
.btn.dgr{background:#fff;color:var(--danger);border:1px solid var(--danger)}
.btnRow{display:flex;gap:10px;margin-bottom:10px}
.btnRow .btn{flex:1}

.avEdit{width:180px;height:180px;border-radius:50%;margin:8px auto 20px;background:#005BBB center/cover;color:#fff;display:grid;place-items:center;font-family:'e-Ukraine',sans-serif;font-weight:700;font-size:56px;cursor:pointer;position:relative;overflow:hidden;border:2px solid #e3e8ee}
.avEdit .hint{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-family:'e-Ukraine',sans-serif;font-weight:500;font-size:12px;text-align:center;padding:6px 0}

.toast{
  position:absolute;left:50%;bottom:calc(var(--tabh) + var(--sb) + 24px);
  transform:translateX(-50%) translateY(10px);
  background:rgba(20,20,20,.94);color:#fff;
  padding:11px 20px;border-radius:22px;
  font-family:'e-Ukraine',sans-serif;font-weight:500;font-size:14px;
  z-index:200;opacity:0;pointer-events:none;
  transition:opacity 240ms,transform 240ms cubic-bezier(.22,.61,.36,1);
  max-width:82%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:14px;text-align:center;padding:60px 20px}

function render(){

    </div>`);
    app.appendChild(sp);
    setTimeout(()=>{sp.remove();render()},2150);
    return;
  }
  app.innerHTML="";

  view.className="view";

}

}

    b.onclick=()=>{if(tab===t.id&&!modal)return;tab=t.id;modal=null;render()};

  });
  return el;
}

/* DOCS */
let docsScrollIdx=0;

function pageDocs(){
  const wrap=document.createElement("div");
  wrap.className="page noScroll";
  wrap.style.display="flex";wrap.style.flexDirection="column";wrap.style.height="100%";
  const track=document.createElement("div");
  track.className="docsTrack";
  state.documents.forEach(d=>track.appendChild(docSlide(d)));
  const add=$(`<div class="actionCard"><div class="acIc">${I.plus}</div><div>Додати документ</div></div>`);
  add.onclick=()=>{modal={type:"add"};render()};
  track.appendChild(add);
  const re=$(`<div class="actionCard reorder"><div class="acIc">${I.swap}</div><div>Змінити порядок<br>документів</div></div>`);
  re.onclick=()=>{modal={type:"reorder"};render()};
  track.appendChild(re);
  wrap.appendChild(track);
  const dots=$(`<div class="dots"></div>`);
  const total=state.documents.length+2;
  for(let i=0;i<total;i++)dots.appendChild($(`<div class="dot"></div>`));
  wrap.appendChild(dots);
  const update=()=>{
    const idx=Math.round(track.scrollLeft/track.clientWidth);
    docsScrollIdx=idx;
    dots.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("on",i===idx));
  };
  track.addEventListener("scroll",()=>{clearTimeout(track._t);track._t=setTimeout(update,50)},{passive:true});
  requestAnimationFrame(()=>{if(docsScrollIdx>0)track.scrollLeft=docsScrollIdx*track.clientWidth;update()});
  return wrap;
}

function docSlide(d){
  const t=DOC_TYPES[d.type]||{title:"Документ",fields:Object.keys(d).filter(k=>!["id","type","photo"].includes(k)),theme:"green"};

  const initials=(state.user.fullName||"?").split(/\s+/).slice(0,2).map(w=>w[0]||"").join("");
  const slide=document.createElement("div");
  slide.className="docSlide";
  const inner=$(`<div class="flipInner">
    <div class="face front">
      <div class="docCard ${theme}">
        <div class="docHead">
          <div class="docHeadTitle">${esc(t.title)}</div>
          ${t.subtitle?`<div class="docHeadSub">${esc(t.subtitle)}</div>`:""}
        </div>
        <div class="docBody"></div>

        <div class="docName">${esc((state.user.fullName||"").toUpperCase())}<button class="docMore"><span></span></button></div>
      </div>
    </div>
    <div class="face back">
      <div class="qrTimer" data-timer>Код діятиме ще 2:59 хв</div>
      <canvas class="qrCanvas" data-qr></canvas>

        <div class="qrBtn active" data-view="qr"><div class="ico">${I.qrIcon}</div><div class="lbl">QR-код</div></div>
        <div class="qrBtn" data-view="bars"><div class="ico">${I.barsIcon}</div><div class="lbl">Штрихкод</div></div>
      </div>
    </div>
  </div>`);
  const body=inner.querySelector(".docBody");
  if(t.hasBigNum){
    const info=$(`<div style="display:flex;flex-direction:column;width:100%;gap:22px;padding-top:6px">
      <div style="font-family:'e-UkraineHead','e-Ukraine',sans-serif;font-weight:700;font-size:22px;line-height:1.28;letter-spacing:-.3px">${esc(state.user.fullName||"").split(/\s+/).map(w=>esc(w)).join("<br>")}</div>
      <div>
        <div style="font-family:'e-Ukraine',sans-serif;font-weight:400;font-size:14px;color:#3a3a3a;margin-bottom:4px">Дата народження:</div>
        <div style="font-family:'e-Ukraine',sans-serif;font-weight:500;font-size:16px">${esc(state.user.birthDate||"—")}</div>
      </div>
      <div class="docBigNum"><span>${esc(d.number||"—")}</span><button class="copyBtn">${I.copy}</button></div>
    </div>`);
    body.appendChild(info);
    info.querySelector(".copyBtn").onclick=(e)=>{e.stopPropagation();copyText(d.number||"")};
  } else {
    if(t.hasPhoto){
      const photo=$(`<div class="docPhoto" ${d.photo?`style="background-image:url('${d.photo}')"`:""}>${d.photo?"":esc(initials)}</div>`);
      body.appendChild(photo);
    }
    const info=document.createElement("div");
    info.className="docInfo";
    const fields=(t.fields||[]).filter(f=>f!=="number"&&d[f]);
    fields.slice(0,4).forEach(f=>{
      info.appendChild($(`<div class="docFld"><div class="lbl">${esc(FIELD_LABELS[f]||f)}:</div><div class="val">${esc(d[f])}</div></div>`));
    });
    if(t.hasSign)info.appendChild($(`<div class="docSign"></div>`));
    body.appendChild(info);
  }
  inner.querySelector(".docMore").onclick=(e)=>{e.stopPropagation();modal={type:"docMenu",id:d.id};render()};
  inner.querySelector(".front").addEventListener("click",(e)=>{
    if(e.target.closest(".docMore")||e.target.closest(".copyBtn"))return;
    flipTo(inner,true,d);
  });
  inner.querySelector(".back").addEventListener("click",(e)=>{
    if(e.target.closest(".qrBtn"))return;
    flipTo(inner,false,d);
  });
  inner.querySelectorAll(".qrBtn").forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      inner.querySelectorAll(".qrBtn").forEach(x=>x.classList.toggle("active",x===b));
      drawBackCanvas(inner,d,b.dataset.view);
    };
  });
  slide.appendChild(inner);
  return slide;
}

function flipTo(inner,on,d){
  if(on){
    inner.classList.add("flipped");
    const tEl=inner.querySelector("[data-timer]");
    let secs=179;
    if(qrTimers[d.id])clearInterval(qrTimers[d.id]);
    const upd=()=>{
      const m=Math.floor(secs/60),s=secs%60;
      tEl.textContent=`Код діятиме ще ${m}:${String(s).padStart(2,"0")} хв`;
      if(secs<=0)clearInterval(qrTimers[d.id]);
      secs--;
    };
    upd();
    qrTimers[d.id]=setInterval(upd,1000);
    setTimeout(()=>{
      const active=inner.querySelector(".qrBtn.active");
      drawBackCanvas(inner,d,active?active.dataset.view:"qr");
    },320);
  } else {
    inner.classList.remove("flipped");
    if(qrTimers[d.id]){clearInterval(qrTimers[d.id]);delete qrTimers[d.id]}
  }
}

function drawBackCanvas(inner,d,view){
  const holder=inner.querySelector(".face.back");
  const cv=inner.querySelector("[data-qr]");
  const payload=JSON.stringify({t:d.type,n:d.number||"",i:state.user.itin||"",d:d.expiresAt||null});
  const oldB=holder.querySelector(".barcode");
  if(oldB)oldB.remove();
  if(view==="qr"){
    cv.style.display="block";
    try{QR.render(cv,payload,250)}catch(err){}
  } else {
    cv.style.display="none";
    const b=document.createElement("div");
    b.className="barcode";
    b.style.width="min(72vw,250px)";
    b.style.height="100px";
    b.style.background="#fff";
    b.style.display="flex";
    b.style.alignItems="flex-end";
    b.style.justifyContent="center";
    b.style.gap="2px";
    b.style.padding="8px 0";
    b.style.marginBottom="26px";
    const seed=payload.split("").reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
    let x=seed;
    for(let i=0;i<70;i++){
      x=(x*1103515245+12345)>>>0;
      const w=1+(x%3);
      const s=document.createElement("span");
      s.style.display="block";
      s.style.height="100%";
      s.style.background="#000";
      s.style.width=w+"px";
      b.appendChild(s);
    }
    const btns=holder.querySelector(".qrBtns");
    holder.insertBefore(b,btns);
  }
}

/* MODALS */
function modalNode(){
  const wrap=document.createElement("div");
  const scrim=$(`<div class="scrim"></div>`);
  scrim.onclick=()=>{modal=null;render()};
  const sheet=$(`<div class="sheet"><div class="sheetGrab"></div><div id="sb"></div></div>`);
  const body=sheet.querySelector("#sb");
  switch(modal.type){
    case "settings":body.appendChild(mSettings());break;
    case "profile":body.appendChild(mProfile());break;
    case "add":body.appendChild(mAdd());break;
    case "reorder":body.appendChild(mReorder());break;
    case "docMenu":body.appendChild(mDocMenu(modal.id));break;
    case "editDoc":body.appendChild(mEditDoc(modal.id));break;
    case "avatar":body.appendChild(mAvatar());break;
    case "import":body.appendChild(mImport());break;
  }
  wrap.appendChild(scrim);wrap.appendChild(sheet);return wrap;
}

    <div class="fld"><label>Повне ім'я</label><input id="i_fn" value="${esc(u.fullName||"")}"></div>
    <div class="fld"><label>Ім'я для привітання</label><input id="i_first" value="${esc(u.firstName||"")}"></div>
    <div class="fld"><label>Телефон</label><input id="i_ph" type="tel" value="${esc(u.phone||"")}"></div>
    <div class="fld"><label>РНОКПП (ІПН)</label><input id="i_it" inputmode="numeric" value="${esc(u.itin||"")}"></div>
    <div class="fld"><label>Дата народження</label><input id="i_bd" value="${esc(u.birthDate||"")}"></div>
    <div class="fld"><label>Стать</label>
      <select id="i_sx">

        <option ${u.sex==="Жіноча"?"selected":""}>Жіноча</option>
      </select></div>
    <div class="btnRow"><button class="btn sec" id="s_av">Фото</button><button class="btn pri" id="s_done">Готово</button></div>
    <div class="btnRow"><button class="btn sec" id="s_exp">Експорт</button><button class="btn sec" id="s_imp">Імпорт</button></div>

  el.querySelector("#i_sx").onchange=e=>{state.user.sex=e.target.value;save(state)};

    const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="diia.json";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  };

function mAdd(){
  const el=document.createElement("div");
  el.innerHTML=`<h2>Додати документ</h2>`;
  Object.entries(DOC_TYPES).forEach(([k,t])=>{
    const b=$(`<button class="btn sec" style="margin-bottom:8px">${esc(t.title)}</button>`);
    b.onclick=()=>{
      const id=k+"_"+Date.now().toString(36);
      state.documents.push({id,type:k,...Object.fromEntries(t.fields.map(f=>[f,""]))});
      save(state);modal={type:"editDoc",id};render();

  });

}

function mReorder(){
  const el=document.createElement("div");
  el.innerHTML=`<h2>Порядок документів</h2><div id="rl"></div>
    <button class="btn pri" style="margin-top:14px" id="d">Готово</button>`;
  const l=el.querySelector("#rl");
  const draw=()=>{
    l.innerHTML="";
    state.documents.forEach((d,i)=>{
      const t=DOC_TYPES[d.type]||{title:"Документ"};
      l.appendChild($(`<div style="display:flex;gap:8px;padding:10px 0;border-bottom:1px solid #EEF0F3;align-items:center">
        <span style="flex:1;font-size:14px">${esc(t.title)}</span>
        <button class="btn sec" style="width:44px;padding:8px 0" data-i="${i}" data-d="-1">↑</button>
        <button class="btn sec" style="width:44px;padding:8px 0" data-i="${i}" data-d="1">↓</button>
        <button class="btn dgr" style="width:44px;padding:8px 0" data-i="${i}" data-d="del">✕</button>
      </div>`));
    });
    l.querySelectorAll("[data-d]").forEach(b=>{
      b.onclick=()=>{
        const i=+b.dataset.i,dd=b.dataset.d;
        if(dd==="del")state.documents.splice(i,1);
        else{const j=i+ +dd;if(j<0||j>=state.documents.length)return;[state.documents[i],state.documents[j]]=[state.documents[j],state.documents[i]]}
        save(state);draw();
      };
    });
  };
  draw();
  el.querySelector("#d").onclick=()=>{modal=null;render()};
  return el;
}

function mDocMenu(id){
  const d=state.documents.find(x=>x.id===id);
  if(!d){modal=null;render();return document.createElement("div")}
  const t=DOC_TYPES[d.type]||{title:"Документ"};
  const el=document.createElement("div");
  el.innerHTML=`<h2>${esc(t.title)}</h2>
    <button class="btn sec" style="margin-bottom:8px" id="e">Редагувати</button>
    <button class="btn dgr" id="x">Видалити</button>`;
  el.querySelector("#e").onclick=()=>{modal={type:"editDoc",id};render()};
  el.querySelector("#x").onclick=()=>{if(confirm("Видалити документ?")){state.documents=state.documents.filter(x=>x.id!==id);save(state);modal=null;render()}};
  return el;
}

function mEditDoc(id){
  const d=state.documents.find(x=>x.id===id);
  if(!d){modal=null;render();return document.createElement("div")}
  const t=DOC_TYPES[d.type]||{title:"Документ",fields:Object.keys(d).filter(k=>!["id","type","photo","title"].includes(k))};
  const el=document.createElement("div");
  el.innerHTML=`<h2>Редагування</h2><div style="font-size:13px;color:#7A7F87;margin:-10px 0 14px">${esc(t.title)}</div><div id="fl"></div>
    <button class="btn pri" style="margin-top:10px" id="d">Готово</button>`;
  const fl=el.querySelector("#fl");
  (t.fields||[]).forEach(f=>{
    const fld=$(`<div class="fld"><label>${esc(FIELD_LABELS[f]||f)}</label><input data-f="${esc(f)}" value="${esc(d[f]??"")}"></div>`);
    fld.querySelector("input").oninput=e=>{d[f]=e.target.value;save(state)};
    fl.appendChild(fld);
  });
  Object.keys(d).forEach(k=>{
    if(["id","type","photo","title"].includes(k))return;
    if((t.fields||[]).includes(k))return;
    const fld=$(`<div class="fld"><label>${esc(FIELD_LABELS[k]||k)}</label><input data-f="${esc(k)}" value="${esc(d[k]??"")}"></div>`);
    fld.querySelector("input").oninput=e=>{d[k]=e.target.value;save(state)};
    fl.appendChild(fld);
  });
  el.querySelector("#d").onclick=()=>{modal=null;render()};
  return el;
}

function mAvatar(){
  const u=state.user;
  const initials=(u.fullName||"?").split(/\s+/).slice(0,2).map(w=>w[0]||"").join("");
  const el=document.createElement("div");
  el.innerHTML=`<h2>Фото профілю</h2>
    <div class="avEdit" id="p" style="${u.avatar?"background-image:url('"+u.avatar+"')":""}">${u.avatar?"":esc(initials)}</div>
    <label class="btn pri" style="text-align:center;margin-bottom:8px">Вибрати фото<input type="file" accept="image/*" id="f" style="display:none"></label>
    ${u.avatar?`<button class="btn dgr" id="r">Видалити</button>`:""}`;
  el.querySelector("#f").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>5*1024*1024){toast("Файл завеликий");return}
    const dataUrl=await fileToDataURL(f);
    const resized=await resizeImage(dataUrl,500,500);
    state.user.avatar=resized;save(state);modal=null;render();
  };
  const r=el.querySelector("#r");
  if(r)r.onclick=()=>{state.user.avatar=null;save(state);modal=null;render()};
  return el;
}

function mImport(){
  const el=document.createElement("div");
  el.innerHTML=`<h2>Імпорт</h2>
    <div class="fld"><label>JSON</label><textarea id="ta"></textarea></div>
    <label class="btn sec" style="text-align:center;margin-bottom:8px">Вибрати файл<input type="file" accept=".json" id="ff" style="display:none"></label>
    <button class="btn pri" id="g">Імпортувати</button>`;
  const ta=el.querySelector("#ta");
  el.querySelector("#ff").onchange=async e=>{const f=e.target.files[0];if(f)ta.value=await f.text()};
  el.querySelector("#g").onclick=()=>{
    try{
      const p=JSON.parse(ta.value);
      if(!p.user||!Array.isArray(p.documents))throw new Error("bad schema");
      state=p;save(state);modal=null;render();toast("Імпортовано");
    }catch(err){toast("Помилка: "+err.message)}
  };
  return el;
}

/* HELPERS */
function toast(msg){
  let t=app.querySelector(".toast");
  if(!t){t=$(`<div class="toast"></div>`);app.appendChild(t)}
  t.textContent=msg;
  requestAnimationFrame(()=>t.classList.add("show"));
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),1600);
}
function copyText(t){
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast("Скопійовано")).catch(()=>fb(t))}
  else fb(t);
}
function fb(t){
  const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";
  document.body.appendChild(a);a.select();
  try{document.execCommand("copy");toast("Скопійовано")}catch(e){toast("Помилка")}
  a.remove();
}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function resizeImage(u,mw,mh){return new Promise(res=>{
  const i=new Image();i.onload=()=>{
    let w=i.width,h=i.height;const r=Math.min(mw/w,mh/h,1);
    w=Math.round(w*r);h=Math.round(h*r);
    const c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(i,0,0,w,h);
    res(c.toDataURL("image/jpeg",.85));
  };i.onerror=()=>res(u);i.src=u;
})}

/* SWIPE-BACK */
let sw=null;
document.addEventListener("touchstart",e=>{
  if(modal&&e.touches[0].clientX<26)sw={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
document.addEventListener("touchend",e=>{
  if(!sw)return;
  const t=e.changedTouches[0];
  if(t.clientX-sw.x>70&&Math.abs(t.clientY-sw.y)<60){modal=null;render()}
  sw=null;
},{passive:true});

render();
